# Local-only defaults. Compose reads optional values from the shell or .env;
# application processes still do not load .env files themselves.
name: agentic-ai-data-analyst
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-5242880}"
      DATASET_TTL_SECONDS: "${DATASET_TTL_SECONDS:-1800}"
      MAX_ACTIVE_DATASETS: "${MAX_ACTIVE_DATASETS:-20}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-30}"
      OPENAI_MAX_OUTPUT_TOKENS: "${OPENAI_MAX_OUTPUT_TOKENS:-1200}"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /app/.tmp:rw,noexec,nosuid,nodev,size=67108864,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: "no"
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-5242880}"
      FRONTEND_REQUEST_TIMEOUT_SECONDS: "${FRONTEND_REQUEST_TIMEOUT_SECONDS:-30}"
      FRONTEND_ANALYSIS_TIMEOUT_SECONDS: "${FRONTEND_ANALYSIS_TIMEOUT_SECONDS:-300}"
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "${STREAMLIT_SERVER_MAX_UPLOAD_SIZE:-5}"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    restart: "no"
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
